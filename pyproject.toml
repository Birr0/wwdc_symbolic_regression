[project]
name = "wwdc-symbolic-reproduction"
version = "0.1.0"
description = "Checkpoint-first reproduction of the WWDC symbolic regression analysis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "astroml>=1.0.2",
  "astropy>=6.0",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=15",
  "scikit-learn>=1.4",
  "scipy>=1.12",
  "sympy>=1.12",
]

[project.optional-dependencies]
catalogues = ["huggingface-hub==1.13.0"]
inference = [
  "torch==2.11.0", "torchvision==0.26.0", "lightning==2.6.1",
  "spender==0.2.9", "flow-matching==1.0.10", "datasets==4.8.5",
  "python-dotenv==1.2.2", "timm==1.0.26", "huggingface-hub==1.13.0",
]

[project.scripts]
wwdc-reproduce = "wwdc_repro.cli:main"
wwdc-figures = "wwdc_repro.figures:main"
wwdc-embed = "wwdc_repro.embedding:main"
wwdc-cmd-cache = "wwdc_repro.catalogue:main"
wwdc-download-catalogues = "wwdc_repro.catalogue:download"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wwdc_repro"]
