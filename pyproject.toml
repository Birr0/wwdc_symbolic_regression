[project]
name = "wwdc-symbolic-reproduction"
version = "0.1.0"
description = "Checkpoint-first reproduction of the WWDC symbolic regression analysis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "astroml>=1.0.2",
  "astropy>=6.0",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=15",
  "scikit-learn>=1.4",
  "sympy>=1.12",
]

[project.scripts]
wwdc-reproduce = "wwdc_repro.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wwdc_repro"]
